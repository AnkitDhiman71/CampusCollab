services:
  # 1. NGINX Load Balancer & Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: campuscare_nginx
    ports:
      - "80:80"
      - "5000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: always

  # 2. Scalable Node.js / Express Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    volumes:
      - shared_uploads:/app/uploads
    restart: always

volumes:
  shared_uploads:
